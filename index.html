<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🖱️ Apprendre à utiliser la Souris</title>
<style>
:root{--bg1:#667eea;--bg2:#764ba2;--blue:#4a90d9;--green:#27ae60;--orange:#e67e22;--purple:#8e44ad;--red:#e74c3c;--dark:#2c3e50;--gray:#95a5a6;--light:#ecf0f1;--white:#fff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2));min-height:100vh;color:var(--dark);overflow:hidden;height:100vh}
/* HEADER */
#header{background:rgba(0,0,0,.25);color:#fff;padding:8px 20px;display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(10px);height:56px;position:relative;z-index:100}
#header h1{font-size:1.3em;display:flex;align-items:center;gap:8px}
#header-right{display:flex;align-items:center;gap:20px;font-size:.95em}
#global-score{background:rgba(255,255,255,.15);padding:6px 14px;border-radius:20px;cursor:help;position:relative}
#global-score:hover::after{content:'Réussite: +6 pts | Erreur: -2 pts';position:absolute;top:110%;right:0;background:rgba(0,0,0,.85);color:#fff;padding:6px 12px;border-radius:8px;font-size:.8em;white-space:nowrap;z-index:999}
#global-timer{background:rgba(255,255,255,.15);padding:6px 14px;border-radius:20px}
/* MAIN */
#main{height:calc(100vh - 56px);overflow:hidden;position:relative}
/* MENU */
#menu{display:flex;flex-direction:column;align-items:center;padding:20px;height:100%;overflow-y:auto}
#menu h2{color:#fff;font-size:1.6em;margin-bottom:15px;text-shadow:2px 2px 4px rgba(0,0,0,.3)}
.menu-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:900px;width:100%}
.menu-btn{background:#fff;border:none;border-radius:14px;padding:14px 10px;cursor:pointer;transition:all .3s;box-shadow:0 4px 15px rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-height:120px;justify-content:center}
.menu-btn:hover{transform:translateY(-4px);box-shadow:0 8px 25px rgba(0,0,0,.25)}
.menu-btn:active{transform:scale(.97)}
.menu-btn .icon{font-size:2em}
.menu-btn .title{font-weight:700;font-size:.85em;color:var(--dark)}
.menu-btn .desc{font-size:.7em;color:var(--gray);line-height:1.3}
.menu-btn{position:relative}
.menu-btn.completed{opacity:.5;border:3px solid var(--green);pointer-events:none}
.menu-btn.completed::after{content:'✅';position:absolute;top:-4px;right:-4px;font-size:1.1em;background:var(--green);color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.3);z-index:5}
.results-btn{background:linear-gradient(135deg,#f093fb,#f5576c);color:#fff;grid-column:span 4;max-width:220px;justify-self:center}
.results-btn .title{color:#fff}
.results-btn .desc{color:rgba(255,255,255,.8)}
/* GAME AREA */
#game-area{display:none;height:100%;flex-direction:column;position:relative}
.game-header{background:rgba(0,0,0,.2);color:#fff;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.game-header h2{font-size:1.1em}
.game-header-info{display:flex;align-items:center;gap:12px;font-size:.9em}
.game-header-info span{background:rgba(255,255,255,.15);padding:4px 10px;border-radius:12px}
.game-content{flex:1;overflow:hidden;padding:12px;position:relative;display:flex;flex-direction:column}
.game-nav{display:flex;gap:10px;padding:8px 16px;background:rgba(0,0,0,.15);flex-shrink:0;align-items:center;justify-content:center}
.btn{padding:8px 18px;border:none;border-radius:8px;cursor:pointer;font-size:.9em;font-weight:600;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.btn-back{background:var(--gray);color:#fff}
.btn-restart{background:var(--orange);color:#fff}
.btn-next{background:var(--green);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-purple{background:var(--purple);color:#fff}
/* VISUAL MOUSE */
#visual-mouse{position:fixed;bottom:15px;right:15px;z-index:1000;pointer-events:none}
.mouse-body{width:80px;height:120px;background:linear-gradient(180deg,#e8e8e8,#d0d0d0);border-radius:40px 40px 35px 35px;position:relative;box-shadow:0 4px 15px rgba(0,0,0,.3);border:2px solid #bbb}
.mouse-btn-left,.mouse-btn-right{position:absolute;top:8px;width:36px;height:42px;border-radius:8px 8px 0 0;transition:all .15s}
.mouse-btn-left{left:4px;background:linear-gradient(180deg,#f5f5f5,#e0e0e0);border-right:1px solid #ccc;border-radius:12px 4px 0 0}
.mouse-btn-right{right:4px;background:linear-gradient(180deg,#f5f5f5,#e0e0e0);border-left:1px solid #ccc;border-radius:4px 12px 0 0}
.mouse-btn-left.active{background:var(--blue)!important;box-shadow:0 0 15px rgba(74,144,217,.6);transform:scale(.93)}
.mouse-btn-right.active{background:var(--purple)!important;box-shadow:0 0 15px rgba(142,68,173,.6);transform:scale(.93)}
.mouse-scroll{position:absolute;top:50px;left:50%;transform:translateX(-50%);width:10px;height:18px;background:#aaa;border-radius:5px}
.mouse-wire{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);width:4px;height:20px;background:#999;border-radius:0 0 2px 2px}
#mouse-action{text-align:center;margin-top:8px;font-size:.75em;color:#fff;background:rgba(0,0,0,.5);padding:4px 10px;border-radius:10px;white-space:nowrap;font-weight:600}
/* CONTEXT MENU */
#context-menu{position:fixed;background:#fff;border:1px solid #d0d0d0;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.2);min-width:200px;z-index:2000;display:none;padding:4px 0;font-size:.85em}
.ctx-item{padding:7px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .15s}
.ctx-item:hover{background:#e8f0fe;color:var(--blue)}
.ctx-item .ctx-icon{width:20px;text-align:center;font-size:1em}
.ctx-item .ctx-shortcut{margin-left:auto;color:#999;font-size:.8em}
.ctx-separator{height:1px;background:#e0e0e0;margin:4px 8px}
/* WINDOWS WINDOW */
.win-window{background:#fff;border:1px solid #999;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.25);overflow:hidden;position:absolute;min-width:280px;animation:fadeIn .3s}
.win-titlebar{background:linear-gradient(180deg,#4a90d9,#3a7bc8);color:#fff;padding:6px 10px;display:flex;align-items:center;justify-content:space-between;font-size:.85em;font-weight:600}
.win-controls{display:flex;gap:4px}
.win-ctrl{width:28px;height:22px;border:none;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.75em;font-weight:700}
.win-ctrl-close{background:#e74c3c;color:#fff}
.win-ctrl-close:hover{background:#c0392b}
.win-ctrl-min{background:rgba(255,255,255,.3);color:#fff}
.win-ctrl-max{background:rgba(255,255,255,.3);color:#fff}
.win-body{padding:16px;font-size:.9em;line-height:1.5;color:var(--dark)}
/* TARGETS */
.target{position:absolute;width:70px;height:70px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s,box-shadow .15s;font-weight:700;color:#fff;font-size:.85em;box-shadow:0 4px 12px rgba(0,0,0,.2);user-select:none}
.target:hover{transform:scale(1.1);box-shadow:0 6px 18px rgba(0,0,0,.3)}
.target.left{background:linear-gradient(135deg,#4a90d9,#357abd)}
.target.right{background:linear-gradient(135deg,#8e44ad,#7d3c98)}
.target .t-num{font-size:1.3em}
.target .t-type{font-size:.65em;opacity:.9}
.target.done{opacity:.4;pointer-events:none;transform:scale(.8)}
/* FOLDER ICONS */
.folder-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:10px}
.folder-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px;border-radius:10px;cursor:pointer;transition:all .2s;background:rgba(255,255,255,.1);min-height:90px;justify-content:center;user-select:none}
.folder-item:hover{background:rgba(255,255,255,.25);transform:scale(1.05)}
.folder-item.opened{opacity:.4;pointer-events:none;filter:grayscale(1)}
.folder-item .f-icon{font-size:2.5em}
.folder-item .f-name{font-size:.75em;color:#fff;text-align:center;font-weight:600}
.folder-item .f-hint{font-size:.6em;color:rgba(255,255,255,.7)}
/* FILE ITEMS */
.file-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fff;border-radius:8px;margin:4px 0;cursor:pointer;transition:all .2s;user-select:none;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.file-item:hover{box-shadow:0 4px 12px rgba(0,0,0,.15)}
.file-item.cut{opacity:.4;border:2px dashed var(--orange)}
.file-item .fi-icon{font-size:1.5em}
.file-item .fi-name{font-size:.85em;font-weight:600}
/* ZONES */
.zone{border:2px dashed rgba(255,255,255,.5);border-radius:12px;padding:12px;min-height:120px;background:rgba(255,255,255,.08);transition:all .3s}
.zone.highlight{border-color:#fff;background:rgba(255,255,255,.2);box-shadow:0 0 20px rgba(255,255,255,.15)}
.zone-title{color:#fff;font-weight:700;margin-bottom:8px;font-size:.9em;display:flex;align-items:center;gap:6px}
/* DRAG ITEMS */
.drag-item{display:inline-flex;align-items:center;gap:4px;padding:8px 14px;background:#fff;border-radius:8px;cursor:grab;user-select:none;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:1em;font-weight:600;touch-action:none}
.drag-item:active{cursor:grabbing}
.drag-item.dragging{opacity:.5;transform:scale(1.1);z-index:999;position:fixed;pointer-events:none}
.drag-item.placed{opacity:.4;pointer-events:none}
/* DROP ZONES */
.drop-zone{border:2px dashed rgba(255,255,255,.4);border-radius:12px;padding:10px;min-height:100px;background:rgba(255,255,255,.05);transition:all .3s;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.drop-zone.drag-over{border-color:#fff;background:rgba(255,255,255,.2);box-shadow:inset 0 0 20px rgba(255,255,255,.1)}
.drop-zone-title{width:100%;color:#fff;font-weight:700;font-size:.9em;margin-bottom:4px}
/* TEXT SELECT */
.text-passage{background:#fff;border-radius:10px;padding:16px;line-height:1.8;font-size:1em;color:var(--dark);user-select:text;box-shadow:0 2px 10px rgba(0,0,0,.1);max-width:700px;margin:0 auto}
.text-passage .highlight-word{background:#ffeaa7;border-radius:3px;padding:0 2px}
.text-passage .highlight-sentence{background:#81ecec;border-radius:3px;padding:0 2px}
.select-instruction{color:#fff;font-size:.85em;margin-bottom:10px;background:rgba(0,0,0,.2);padding:8px 12px;border-radius:8px;text-align:center}
/* MODAL */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:3000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
#modal-overlay.show{display:flex}
#modal-box{background:#fff;border-radius:16px;padding:30px;max-width:500px;width:90%;text-align:center;animation:bounceIn .4s;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#modal-box h2{margin-bottom:12px;font-size:1.5em}
#modal-box p{margin-bottom:8px;color:var(--gray);line-height:1.5}
#modal-box .score-display{font-size:1.8em;font-weight:700;color:var(--green);margin:12px 0}
#modal-box .btn{margin:6px}
/* TOAST */
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:4000;display:none}
#toast.show{display:block;animation:slideInDown .3s}
.toast-box{padding:10px 20px;border-radius:10px;color:#fff;font-weight:600;font-size:.9em;box-shadow:0 4px 15px rgba(0,0,0,.2);display:flex;align-items:center;gap:8px}
.toast-box.success{background:var(--green)}
.toast-box.error{background:var(--red)}
.toast-box.info{background:var(--blue)}
/* INSTRUCTION BOX */
.instruction-box{background:rgba(255,255,255,.15);color:#fff;padding:10px 14px;border-radius:10px;margin-bottom:10px;font-size:.85em;line-height:1.4;backdrop-filter:blur(5px);text-align:center}
/* PROGRESS */
.progress-bar{background:rgba(0,0,0,.2);border-radius:10px;height:8px;overflow:hidden;margin:6px 0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--green),#2ecc71);border-radius:10px;transition:width .3s}
/* REVIEW GAME */
.review-area{position:relative;flex:1;overflow:hidden;border-radius:12px;background:linear-gradient(180deg,#87CEEB 0%,#87CEEB 40%,#98D8A0 40%,#98D8A0 100%)}
.review-monument{position:absolute;font-size:2em;opacity:.25;pointer-events:none;user-select:none}
.review-item{position:absolute;font-size:1.8em;cursor:pointer;transition:all .2s;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.review-item:hover{transform:scale(1.2)}
.review-phase-text{background:rgba(0,0,0,.6);color:#fff;padding:6px 12px;border-radius:8px;font-size:.8em;text-align:center;position:absolute;bottom:8px;left:50%;transform:translateX(-50%);white-space:nowrap;z-index:10}
.review-consigne{background:rgba(0,0,0,.7);color:#fff;padding:10px 14px;border-radius:10px;margin-bottom:8px;font-size:.85em;text-align:center;flex-shrink:0}
/* ROTATION HANDLE */
.rotatable{cursor:grab;border:3px solid transparent;border-radius:8px;transition:border-color .2s}
.rotatable:hover{border-color:rgba(255,255,255,.5)}
.rotatable.selected{border-color:var(--blue)}
/* INPUT FIELD */
.game-input{padding:8px 12px;border:2px solid #ddd;border-radius:8px;font-size:1em;width:100%;transition:border-color .2s}
.game-input:focus{outline:none;border-color:var(--blue)}
/* COLOR COMBINATION */
.color-drop{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5em;font-weight:700;color:#fff;cursor:pointer;transition:all .2s;border:3px solid rgba(255,255,255,.3)}
.color-drop:hover{transform:scale(1.1)}
/* ANIMATIONS */
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes fadeIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes slideInDown{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes bounceIn{0%{opacity:0;transform:scale(.3)}50%{transform:scale(1.05)}70%{transform:scale(.95)}100%{opacity:1;transform:scale(1)}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
.shake{animation:shake .4s!important}
.bounce{animation:bounce .4s!important}
/* PRINT */
@media print{
  body{background:#fff!important;height:auto!important;min-height:0!important;overflow:visible!important}
  #header,#visual-mouse,#context-menu,#game-area,#toast,#modal-overlay,#main{display:none!important}
  #print-area{display:block!important;position:static!important}
  #menu{display:none!important}
}
#print-area{display:none;font-family:'Segoe UI',sans-serif;color:#333;padding:20px}
#print-area h1{text-align:center;color:var(--bg1);margin-bottom:20px}
#print-area table{width:100%;border-collapse:collapse;margin-bottom:20px}
#print-area th,#print-area td{border:1px solid #ddd;padding:8px 12px;text-align:left;font-size:.9em}
#print-area th{background:var(--bg1);color:#fff}
#print-area .total-row{font-weight:700;background:#f0f0f0}
/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3);border-radius:3px}
</style>
</head>
<body>
<!-- HEADER -->
<div id="header">
  <h1>🖱️ Apprendre à utiliser la Souris</h1>
  <div id="header-right">
    <span id="global-score">⭐ Score: <b id="gs-value">0</b></span>
    <span id="global-timer">⏱️ <b id="gt-value">00:00</b></span>
  </div>
</div>
<!-- MAIN -->
<div id="main">
  <!-- MENU -->
  <div id="menu">
    <h2>🎮 Choisis un jeu pour apprendre !</h2>
    <div class="menu-grid">
      <button class="menu-btn" onclick="startGame('click')"><span class="icon">👆</span><span class="title">1. Clic Simple</span><span class="desc">Clic gauche et droit sur des cibles</span></button>
      <button class="menu-btn" onclick="startGame('dblclick')"><span class="icon">👆👆</span><span class="title">2. Double-Clic</span><span class="desc">Ouvrir des dossiers et fichiers</span></button>
      <button class="menu-btn" onclick="startGame('copypaste')"><span class="icon">📋</span><span class="title">3. Copier / Coller</span><span class="desc">Dupliquer avec le menu contextuel</span></button>
      <button class="menu-btn" onclick="startGame('cutpaste')"><span class="icon">✂️</span><span class="title">4. Couper / Coller</span><span class="desc">Déplacer des fichiers</span></button>
      <button class="menu-btn" onclick="startGame('dragdrop')"><span class="icon">✋</span><span class="title">5. Glisser-Déposer</span><span class="desc">Trier des éléments par catégorie</span></button>
      <button class="menu-btn" onclick="startGame('rename')"><span class="icon">✏️</span><span class="title">6. Renommer</span><span class="desc">Corriger les noms de fichiers</span></button>
      <button class="menu-btn" onclick="startGame('select')"><span class="icon">📝</span><span class="title">7. Sélectionner</span><span class="desc">Sélectionner du texte</span></button>
      <button class="menu-btn" onclick="startGame('review')"><span class="icon">🏆</span><span class="title">8. Révision</span><span class="desc">Jeu de piste à Paris !</span></button>
      <button class="menu-btn results-btn" onclick="showResults()"><span class="icon">📊</span><span class="title">Résultats</span><span class="desc">Imprimer les résultats en PDF</span></button>
    </div>
  </div>
  <!-- GAME AREA -->
  <div id="game-area">
    <div class="game-header">
      <h2 id="game-title"></h2>
      <div class="game-header-info">
        <span id="game-progress"></span>
        <span id="game-score">⭐ 0</span>
        <span id="game-timer">⏱️ 00:00</span>
      </div>
    </div>
    <div class="game-content" id="game-content"></div>
    <div class="game-nav">
      <button class="btn btn-back" onclick="backToMenu()">← Retour au menu</button>
      <button class="btn btn-restart" id="btn-restart" onclick="restartGame()">🔄 Recommencer</button>
    </div>
  </div>
</div>
<!-- VISUAL MOUSE -->
<div id="visual-mouse">
  <div class="mouse-body">
    <div class="mouse-btn-left" id="mouse-left"></div>
    <div class="mouse-btn-right" id="mouse-right"></div>
    <div class="mouse-scroll"></div>
    <div class="mouse-wire"></div>
  </div>
  <div id="mouse-action">Prêt</div>
</div>
<!-- CONTEXT MENU -->
<div id="context-menu"></div>
<!-- TOAST -->
<div id="toast"><div class="toast-box" id="toast-box"></div></div>
<!-- MODAL -->
<div id="modal-overlay"><div id="modal-box"></div></div>
<!-- PRINT AREA -->
<div id="print-area"></div>

<script>
/* ===== STATE ===== */
const S={
  currentGame:null,
  globalScore:0,
  globalStart:null,
  globalInterval:null,
  gameTimers:{},
  results:{},
  clipboard:null,
  gameScore:0,
  gameErrors:0,
  gameStartTime:null,
  gameTime:0
};
/* ===== UTILS ===== */
function $(id){return document.getElementById(id)}
function qs(sel,el){return (el||document).querySelector(sel)}
function qsa(sel,el){return (el||document).querySelectorAll(sel)}
function fmt(s){const m=Math.floor(s/60),sec=Math.floor(s%60);return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=rnd(0,i);[b[i],b[j]]=[b[j],b[i]]}return b}
/* ===== GLOBAL TIMER ===== */
function startGlobalTimer(){
  if(S.globalStart)return;
  S.globalStart=Date.now()-S.gameTime*1000;
  S.globalInterval=setInterval(()=>{
    const e=(Date.now()-S.globalStart)/1000;
    $('gt-value').textContent=fmt(e);
  },500);
}
function stopGlobalTimer(){clearInterval(S.globalInterval)}
function getGlobalElapsed(){return S.globalStart?(Date.now()-S.globalStart)/1000:0}
/* ===== GAME TIMER ===== */
let _gTimer=null;
function startGameTimer(){
  S.gameStartTime=Date.now();
  _gTimer=setInterval(()=>{
    const e=(Date.now()-S.gameStartTime)/1000;
    if($('game-timer'))$('game-timer').textContent='⏱️ '+fmt(e);
  },500);
}
function stopGameTimer(){clearInterval(_gTimer)}
function getGameElapsed(){return S.gameStartTime?(Date.now()-S.gameStartTime)/1000:0}
/* ===== SCORE ===== */
function addScore(pts){
  S.gameScore+=pts;
  S.globalScore+=pts;
  $('gs-value').textContent=S.globalScore;
  if($('game-score'))$('game-score').textContent='⭐ '+S.gameScore;
}
/* ===== VISUAL MOUSE ===== */
function setMouseAction(txt){$('mouse-action').textContent=txt}
function flashMouse(btn){
  const el=btn==='left'?$('mouse-left'):$('mouse-right');
  el.classList.add('active');

/* ===== CONTEXT MENU ===== */
const CM=$('context-menu');
function showContextMenu(x,y,items){
  CM.innerHTML='';
  items.forEach(it=>{
    if(it==='sep'){const s=document.createElement('div');s.className='ctx-separator';CM.appendChild(s);return}
    const d=document.createElement('div');
    d.className='ctx-item';
    d.innerHTML=`<span class="ctx-icon">${it.icon||''}</span><span>${it.label}</span>${it.shortcut?`<span class="ctx-shortcut">${it.shortcut}</span>`:''}`;
    d.addEventListener('mousedown',e=>{e.preventDefault();e.stopPropagation()});
    d.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();hideContextMenu();it.action()});
    CM.appendChild(d);
  });
  CM.style.display='block';
  CM.style.left=Math.min(x,window.innerWidth-220)+'px';
  CM.style.top=Math.min(y,window.innerHeight-CM.offsetHeight-10)+'px';
}
function hideContextMenu(){CM.style.display='none'}
document.addEventListener('click',e=>{if(!CM.contains(e.target))hideContextMenu()});
document.addEventListener('contextmenu',e=>{
  if(e.target.closest('#game-content'))e.preventDefault();
});
/* ===== TOAST ===== */
let _toastTimer=null;
function showToast(msg,type='info',dur=2000){
  const t=$('toast'),b=$('toast-box');
  b.className='toast-box '+type;
  b.textContent=msg;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>t.classList.remove('show'),dur);
}
function showSuccess(msg='Bravo ! ✅'){showToast(msg,'success');setMouseAction('✅ Réussi !')}
function showError(msg='Erreur ❌'){showToast(msg,'error');setMouseAction('❌ Erreur')}
/* ===== MODAL ===== */
function showModal(html){$('modal-box').innerHTML=html;$('modal-overlay').classList.add('show')}
function hideModal(){$('modal-overlay').classList.remove('show')}
$('modal-overlay').addEventListener('click',e=>{if(e.target===$('modal-overlay'))hideModal()});
/* ===== NAVIGATION ===== */
function showMenu(){
  stopGameTimer();
  $('menu').style.display='flex';
  $('game-area').style.display='none';
  S.currentGame=null;
  hideContextMenu();
  updateMenuButtons();
}
function startGame(id){
  // Check if already completed perfectly
  if(S.results[id]&&S.results[id].errors===0){
    showModal(`<h2>🏆 Déjà réussi !</h2><p>Tu as déjà complété ce jeu sans aucune erreur !</p><br><button class="btn btn-blue" onclick="hideModal()">OK</button>`);
    return;
  }
  S.currentGame=id;
  S.gameScore=0;
  S.gameErrors=0;
  S.gameTime=0;
  $('menu').style.display='none';
  $('game-area').style.display='flex';
  if($('game-score'))$('game-score').textContent='⭐ 0';
  startGlobalTimer();
  startGameTimer();
  const gc=$('game-content');
  gc.innerHTML='';
  if(Games[id])Games[id].init(gc);
}
function backToMenu(){
  // Save time
  const elapsed=getGameElapsed();
  if(S.currentGame){
    if(!S.results[S.currentGame])S.results[S.currentGame]={score:0,errors:0,time:0};
    S.results[S.currentGame].time+=elapsed;
  }
  showMenu();
}
function restartGame(){
  if(S.currentGame)startGame(S.currentGame);
}
function finishGame(id,score,errors){
  stopGameTimer();
  const elapsed=getGameElapsed();
  const existing=S.results[id];
  // Save result only if better or first time
  if(!existing||score>existing.score){
    S.results[id]={score,errors,time:elapsed,perfect:errors===0};
  }
  const wasPerfect=errors===0;
  showModal(`
    <h2>${wasPerfect?'🏆 Parfait !':'🎉 Bravo !'}</h2>
    <p>Tu as terminé le jeu !</p>
    <div class="score-display">Score: ${score}</div>
    <p>Erreurs: ${errors} | Temps: ${fmt(elapsed)}</p>
    ${wasPerfect?'<p style="color:var(--green);font-weight:700">🌟 Zéro erreur ! Tu ne peux plus rejouer ce jeu.</p>':''}
    <br>
    <button class="btn btn-back" onclick="hideModal();showMenu()">← Menu</button>
    ${!wasPerfect?`<button class="btn btn-restart" onclick="hideModal();restartGame()">🔄 Recommencer</button>`:''}
  `);
  updateMenuButtons();
}
function updateMenuButtons(){
  document.querySelectorAll('.menu-btn').forEach(b=>{
    b.classList.remove('completed');
    const gid=b.getAttribute('onclick')?.match(/'(\w+)'/)?.[1];
    if(gid&&S.results[gid]&&S.results[gid].perfect){
      b.classList.add('completed');
    }
  });
}

const Games={};

/* ---- GAME 1: CLICK SIMPLE ---- */
Games.click=(function(){
  const TOTAL=15;
  let targets=[],current=0;
  function init(container){
    $('game-title').textContent='👆 Clic Simple (Gauche et Droit)';
    targets=[];
    current=0;
    updateProgress();
    const inst=document.createElement('div');
    inst.className='instruction-box';
    inst.textContent='Clique sur les cibles dans l\'ordre (1 à 15) avec le BON bouton ! Bleu = Gauche, Violet = Droit';
    container.appendChild(inst);
    const pb=document.createElement('div');
    pb.className='progress-bar';
    pb.innerHTML='<div class="progress-fill" id="click-pb" style="width:0%"></div>';
    container.appendChild(pb);
    const area=document.createElement('div');
    area.style.cssText='flex:1;position:relative;overflow:hidden';
    container.appendChild(area);
    const types=Array.from({length:TOTAL},()=>Math.random()<.5?'left':'right');
    const positions=generatePositions();
    for(let i=0;i<TOTAL;i++){
      const t=document.createElement('div');
      t.className='target '+types[i];
      t.style.left=positions[i].x+'%';
      t.style.top=positions[i].y+'%';
      t.innerHTML=`<span class="t-num">${i+1}</span><span class="t-type">${types[i]==='left'?'🖱️ Gauche':'🖱️ Droit'}</span>`;
      t.dataset.index=i;
      t.dataset.type=types[i];
      t.addEventListener('mousedown',e=>{e.preventDefault()});
      t.addEventListener('contextmenu',e=>e.preventDefault());
      t.addEventListener('mouseup',e=>{
        e.preventDefault();
        const idx=parseInt(t.dataset.index);
        if(idx!==current)return;
        const isLeft=e.button===0;
        const isRight=e.button===2;
        const needLeft=t.dataset.type==='left';
        if((needLeft&&isLeft)||(!needLeft&&isRight)){
          addScore(6);
          t.classList.add('done');
          current++;
          updateProgress();
          showSuccess(`Cible ${current}/${TOTAL} ✅`);
          if(current>=TOTAL){
            setTimeout(()=>finishGame('click',S.gameScore,S.gameErrors),500);
          }
        } else {
          addScore(-2);
          S.gameErrors++;
          t.classList.add('shake');
          setTimeout(()=>t.classList.remove('shake'),400);
          showError(needLeft?'Utilise le bouton GAUCHE !':'Utilise le bouton DROIT !');
        }
      });
      area.appendChild(t);
      targets.push(t);
    }
  }
  function generatePositions(){
    const pos=[];
    for(let i=0;i<TOTAL;i++){
      let x,y,ok=false,tries=0;
      while(!ok&&tries<200){
        x=rnd(2,85);y=rnd(2,85);
        ok=true;
        for(const p of pos){
          if(Math.abs(p.x-x)<9&&Math.abs(p.y-y)<12){ok=false;break}
        }
        tries++;
      }
      pos.push({x,y});
    }
    return pos;
  }
  function updateProgress(){
    if($('game-progress'))$('game-progress').textContent=`Cible: ${current+1}/${TOTAL}`;
    const pb=$('click-pb');
    if(pb)pb.style.width=(current/TOTAL*100)+'%';
  }
  return {init};
})();

      f.innerHTML=`<span class="fi-icon">${FILES[i].icon}</span><span class="fi-name">${FILES[i].name}</span>`;

    dstZone.appendChild(dstFiles);
    dstZone.addEventListener('selectstart',e=>{e.preventDefault()});
    dstZone.addEventListener('contextmenu',e=>{
      e.preventDefault();e.stopPropagation();
      showContextMenu(e.clientX,e.clientY,[
        {icon:'📋',label:'Coller',shortcut:'Ctrl+V',action:()=>{
          if(!S.cpCut){showError('Coupe d\'abord le fichier !');return}
          const f=document.createElement('div');
          f.className='file-item';
          f.style.borderColor='var(--green)';
          f.innerHTML=`<span class="fi-icon">${S.clipboard.icon}</span><span class="fi-name">${S.clipboard.name}</span>`;
          f.style.animation='pop .3s';
          dstFiles.appendChild(f);
          // Remove from source
          if(currentFileEl)currentFileEl.remove();
          addScore(6);
          showSuccess('Fichier déplacé !');
          S.cpCut=false;
          const nb=document.createElement('div');
          nb.style.cssText='text-align:center;margin-top:10px';
          const lbl=step+1<TOTAL?`Suivant ${step+2}/${TOTAL} →`:'Terminer →';
          nb.innerHTML=`<button class="btn btn-next" onclick="Games.cutpaste._next()">${lbl}</button>`;
          container.appendChild(nb);
        }},
        'sep',
        {icon:'📋',label:'Copier',shortcut:'Ctrl+C',action:()=>{showError('Il faut COLLER ici !')}}
      ]);

    row.appendChild(dstZone);
    container.appendChild(row);
  }
  function next(){step++;renderStep($('game-content'))}
  function updateProgress(){if($('game-progress'))$('game-progress').textContent=`Fichier: ${step+1}/${TOTAL}`}
  return {init,_next:next};
})();

/* ---- GAME 5: DRAG DROP ---- */
Games.dragdrop=(function(){
  const CATS=[
    {name:'Fruits 🍎',emoji:'🍎',items:['🍎','🍌','🍇','🍊','🍓']},
    {name:'Animaux 🐾',emoji:'🐾',items:['🐶','🐱','🐰','🐟','🦁']},
    {name:'Véhicules 🚗',emoji:'🚗',items:['🚗','🚁','✈️','🚲','🚢']}
  ];
  const TOTAL=15;
  let placed=0;
  let dragEl=null,dragClone=null,offsetX=0,offsetY=0,dragCategory='';
  function init(container){
    $('game-title').textContent='✋ Glisser-Déposer';
    placed=0;
    updateProgress();
    const inst=document.createElement('div');
    inst.className='instruction-box';
    inst.textContent='Glisse chaque élément dans la bonne catégorie ! (Maintenir le clic gauche et déplacer)';
    container.appendChild(inst);
    const pb=document.createElement('div');
    pb.className='progress-bar';
    pb.innerHTML='<div class="progress-fill" id="dd-pb" style="width:0%"></div>';
    container.appendChild(pb);
    // Drop zones
    const zonesRow=document.createElement('div');
    zonesRow.style.cssText='display:flex;gap:12px;margin-top:8px;flex-shrink:0';
    CATS.forEach(cat=>{
      const z=document.createElement('div');
      z.className='drop-zone';
      z.style.flex='1';
      z.dataset.category=cat.name;
      z.innerHTML=`<div class="drop-zone-title">${cat.name}</div>`;
      z.id='dz-'+cat.name;
      zonesRow.appendChild(z);
    });
    container.appendChild(zonesRow);
    // Items area
    const itemsArea=document.createElement('div');
    itemsArea.style.cssText='display:flex;flex-wrap:wrap;gap:8px;padding:12px;justify-content:center;align-items:center;flex:1;align-content:center;background:rgba(255,255,255,.05);border-radius:12px;margin-top:8px';
    // Create shuffled items
    let allItems=[];
    CATS.forEach(cat=>{cat.items.forEach(it=>{allItems.push({emoji:it,category:cat.name})})});
    allItems=shuffle(allItems);
    allItems.forEach(item=>{
      const d=document.createElement('div');
      d.className='drag-item';
      d.textContent=item.emoji;
      d.dataset.category=item.category;
      d.style.fontSize='1.5em';
      d.addEventListener('mousedown',e=>{
        e.preventDefault();
        startDrag(d,e,item.category);
      });
      itemsArea.appendChild(d);
    });
    container.appendChild(itemsArea);
  }
  function startDrag(el,e,cat){
    dragEl=el;
    dragCategory=cat;
    setMouseAction('Glisser...');
    const rect=el.getBoundingClientRect();
    offsetX=e.clientX-rect.left;
    offsetY=e.clientY-rect.top;
    // Create floating clone
    dragClone=el.cloneNode(true);
    dragClone.className='drag-item dragging';
    dragClone.style.left=(e.clientX-offsetX)+'px';
    dragClone.style.top=(e.clientY-offsetY)+'px';
    dragClone.style.width=rect.width+'px';
    document.body.appendChild(dragClone);
    el.style.opacity='.3';
    document.addEventListener('mousemove',onDragMove);
    document.addEventListener('mouseup',onDragEnd);
  }
  function onDragMove(e){
    if(!dragClone)return;
    dragClone.style.left=(e.clientX-offsetX)+'px';
    dragClone.style.top=(e.clientY-offsetY)+'px';
    // Highlight drop zones
    CATS.forEach(cat=>{
      const z=$('dz-'+cat.name);
      if(!z)return;
      const r=z.getBoundingClientRect();
      if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){
        z.classList.add('drag-over');
      }else{
        z.classList.remove('drag-over');
      }
    });
  }
  function onDragEnd(e){
    document.removeEventListener('mousemove',onDragMove);
    document.removeEventListener('mouseup',onDragEnd);
    if(!dragClone){return}
    dragClone.remove();
    dragClone=null;
    // Check drop zone
    let dropped=false;
    CATS.forEach(cat=>{
      const z=$('dz-'+cat.name);
      if(!z)return;
      z.classList.remove('drag-over');
      const r=z.getBoundingClientRect();
      if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){
        if(cat.name===dragCategory){
          // Correct!
          addScore(6);
          placed++;
          const sp=document.createElement('span');
          sp.style.cssText='font-size:1.5em;padding:4px';
          sp.textContent=dragEl.textContent;
          sp.style.animation='pop .3s';
          z.appendChild(sp);
          dragEl.classList.add('placed');
          dragEl.style.opacity='';
          showSuccess(`${placed}/${TOTAL}`);
          updateProgress();
          if(placed>=TOTAL){
            setTimeout(()=>finishGame('dragdrop',S.gameScore,S.gameErrors),600);
          }
        } else {
          // Wrong category
          addScore(-2);S.gameErrors++;
          dragEl.style.opacity='';
          dragEl.classList.add('shake');
          setTimeout(()=>dragEl.classList.remove('shake'),400);
          showError('Mauvaise catégorie !');
        }
        dropped=true;
      }
    });
    if(!dropped&&dragEl){
      dragEl.style.opacity='';
    }
    dragEl=null;
    setMouseAction('Prêt');
  }
  function updateProgress(){
    if($('game-progress'))$('game-progress').textContent=`Placés: ${placed}/${TOTAL}`;
    const pb=$('dd-pb');
    if(pb)pb.style.width=(placed/TOTAL*100)+'%';
  }
  return {init};
})();

      showContextMenu(e.clientX,e.clientY,[

          input.style.cssText='width:180px;font-size:1em;padding:4px 8px';
          input.value=nameEl.textContent;
          nameEl.textContent='';
          nameEl.appendChild(input);
          input.focus();
          input.select();
          // Show verify button
          const verifyArea=$('rename-btn-area');
          if(verifyArea)verifyArea.style.display='flex';
          input.addEventListener('keydown',e2=>{
            if(e2.key==='Enter'){e2.preventDefault();doVerify(task);}
          });
        }},
        {icon:'📋',label:'Copier',shortcut:'Ctrl+C',action:()=>{showError('Il faut RENOMMER le fichier !')}},
        'sep',
        {icon:'🗑️',label:'Supprimer',action:()=>{showError('Il faut RENOMMER, pas supprimer !')}}
      ]);
    });
    fileArea.appendChild(f);
    container.appendChild(fileArea);
    // Button area (hidden until input appears)
    const btnArea=document.createElement('div');
    btnArea.id='rename-btn-area';
    btnArea.style.cssText='display:none;justify-content:center;gap:14px;margin-top:10px;align-items:center;flex-wrap:wrap';
    // Verify button
    const vBtn=document.createElement('button');
    vBtn.className='btn btn-blue';
    vBtn.style.cssText='font-size:1em;padding:10px 22px;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,.15)';
    vBtn.innerHTML='🔍 Vérifier';
    vBtn.onclick=()=>doVerify(task);
    btnArea.appendChild(vBtn);
    // Next button (hidden until verified)
    const nBtn=document.createElement('button');
    nBtn.id='rename-next-btn';
    nBtn.className='btn btn-next';
    nBtn.style.cssText='font-size:1em;padding:10px 22px;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,.15);display:none';
    const lbl=step+1<TOTAL?`Suivant ${step+2}/${TOTAL} →`:'✅ Terminer';
    nBtn.innerHTML=lbl;
    nBtn.onclick=()=>{step++;renderStep($('game-content'))};
    btnArea.appendChild(nBtn);
    container.appendChild(btnArea);
  }
  function doVerify(task){
    if(verified)return;
    const input=$('rename-input');
    const nameEl=$('rename-name');
    if(!input||!nameEl)return;
    const val=input.value.trim();
    if(!val){showError('Tape un nom !');return}
    verified=true;
    nameEl.textContent=val;
    if(val.toLowerCase()===task.correct.toLowerCase()){
      addScore(6);
      showSuccess('Bien renommé ! ✅');
      nameEl.style.color='var(--green)';
      nameEl.style.fontWeight='700';
    }else{
      addScore(-2);S.gameErrors++;
      showError(`Incorrect. Le bon nom est : "${task.correct}"`);
      nameEl.style.color='var(--red)';
    }

    const verifyArea=$('rename-btn-area');
    if(verifyArea){

      verifyArea.querySelectorAll('.btn-blue')[0].style.display='none';
    }
    const nBtn=$('rename-next-btn');
    if(nBtn)nBtn.style.display='inline-flex';
  }
  function updateProgress(){if($('game-progress'))$('game-progress').textContent=`Fichier: ${step+1}/${TOTAL}`}
  return {init};
})();

/* ---- GAME 7: SELECT TEXT ---- */
Games.select=(function(){
  function norm(s){return s.toLowerCase().replace(/[.,!?;:'"'"]/g,'').replace(/\s+/g,' ').trim()}
  const TASKS=[
    {type:'word',instruction:'Double-clic sur le mot "souris" pour le sélectionner',text:'L\'utilisation de la souris est essentielle pour naviguer sur un ordinateur moderne.',target:'souris'},
    {type:'word',instruction:'Double-clic sur le mot "ordinateur" pour le sélectionner',text:'Pour bien utiliser un ordinateur il faut pratiquer régulièrement les exercices.',target:'ordinateur'},
    {type:'sentence',instruction:'Triple-clic pour sélectionner toute la phrase',text:'Le double-clic permet d\'ouvrir les fichiers et les dossiers sur votre bureau.',target:'Le double-clic permet d\'ouvrir les fichiers et les dossiers sur votre bureau.'},
    {type:'partial',instruction:'Sélectionne avec la souris (clic gauche maintenu + glisser) les mots "cliquer glisser"',text:'Pour réussir vous devez savoir cliquer glisser et déposer avec précision sur l\'écran.',target:'cliquer glisser'},
    {type:'partial',instruction:'Sélectionne avec la souris (clic gauche maintenu + glisser) de "Pratique" jusqu\'à "souris"',text:'Pratique fait la maîtrise de la souris et chaque exercice améliore votre habileté au quotidien.',target:'Pratique fait la maîtrise de la souris'}
  ];
  const TOTAL=TASKS.length;
  let step=0;
  let checked=false;
  function init(container){
    $('game-title').textContent='📝 Sélectionner du texte';
    step=0;
    renderStep(container);
  }
  function renderStep(container){
    container.innerHTML='';
    checked=false;
    if(step>=TOTAL){finishGame('select',S.gameScore,S.gameErrors);return}
    updateProgress();
    const task=TASKS[step];
    const inst=document.createElement('div');
    inst.className='instruction-box';
    inst.innerHTML=`<b>Étape ${step+1}/${TOTAL}</b> — ${task.instruction}`;
    container.appendChild(inst);
    // Tips
    const tips=document.createElement('div');
    tips.style.cssText='color:rgba(255,255,255,.6);font-size:.75em;text-align:center;margin-bottom:8px';
    if(task.type==='word')tips.textContent='💡 Astuce: 2 clics rapides (double-clic) pour sélectionner un mot';
    else if(task.type==='sentence')tips.textContent='💡 Astuce: 3 clics rapides (triple-clic) pour sélectionner une phrase';
    else tips.textContent='💡 Astuce: Maintenir le clic gauche et glisser pour sélectionner';
    container.appendChild(tips);
    const textArea=document.createElement('div');
    textArea.style.cssText='display:flex;justify-content:center;align-items:center;flex:1';
    const passage=document.createElement('div');
    passage.className='text-passage';
    passage.textContent=task.text;
    passage.style.userSelect='text';
    passage.style.cursor='text';
    textArea.appendChild(passage);
    container.appendChild(textArea);
    // Button bar: Vérifier + Suivant side by side
    const btnBar=document.createElement('div');
    btnBar.id='select-btnbar';
    btnBar.style.cssText='display:flex;gap:12px;justify-content:center;align-items:center;margin-top:10px;flex-wrap:wrap';
    // Vérifier button
    const checkBtn=document.createElement('button');
    checkBtn.id='check-select';
    checkBtn.className='btn btn-blue';
    checkBtn.textContent='✓ Vérifier la sélection';
    checkBtn.style.cssText='min-width:180px';
    checkBtn.addEventListener('mousedown',e=>e.preventDefault());
     checkBtn.addEventListener('click',()=>{
       if(checked)return;
       const sel=window.getSelection();
       const selected=sel.toString().trim();
       if(!selected){
         showError('Aucun texte sélectionné ! Sélectionne du texte dans le cadre.');
         addScore(-2);S.gameErrors++;
         return;
       }
       const target=task.target;
       let ok=false;
       if(task.type==='word'){
         ok=norm(selected)===norm(target);
       } else if(task.type==='sentence'){
         ok=norm(selected).length>=norm(target).length*0.7 && norm(target).includes(norm(selected).substring(0,10));
       } else {
         const sn=norm(selected);
         const tn=norm(target);
         ok=sn.includes(tn)||tn.includes(sn);
       }
       if(ok){
         checked=true;
         addScore(6);
         showSuccess('Bonne sélection !');
         checkBtn.className='btn';
         checkBtn.style.cssText='min-width:180px;background:#22c55e;color:#fff;border:none;padding:10px 24px;border-radius:8px;font-size:1em;cursor:default;animation:bounceIn .4s';
         checkBtn.textContent='✅ Bonne sélection !';
         // Show next button only on success
         const nextEl=document.createElement('button');
         nextEl.className='btn btn-next';
         nextEl.style.cssText='min-width:160px;animation:bounceIn .4s';
         const lbl=step+1<TOTAL?`Suivant ${step+2}/${TOTAL} →`:'Terminer →';
         nextEl.textContent=lbl;
         nextEl.addEventListener('mousedown',e=>e.preventDefault());
         nextEl.addEventListener('click',()=>{step++;renderStep(container)});
         btnBar.appendChild(nextEl);
       } else {
         addScore(-2);S.gameErrors++;
         showError(`Sélection incorrecte. Il fallait sélectionner: "${target}"`);
         checkBtn.className='btn';
         checkBtn.style.cssText='min-width:180px;background:#ef4444;color:#fff;border:none;padding:10px 24px;border-radius:8px;font-size:1em;cursor:default;animation:shake .4s';
         checkBtn.textContent='❌ Réessaie';
         // Reset button after 1.2s so user can retry
         setTimeout(()=>{
           if(!checked){
             checkBtn.className='btn btn-blue';
             checkBtn.style.cssText='min-width:180px';
             checkBtn.textContent='✓ Vérifier la sélection';
           }
         },1200);
       }
     });
    btnBar.appendChild(checkBtn);
    container.appendChild(btnBar);
  }
  function updateProgress(){if($('game-progress'))$('game-progress').textContent=`Texte: ${step+1}/${TOTAL}`}
  return {init};
})();

    {type:'select-sentence',desc:'Phase 10: ⛪ Sélectionne la phrase entière (triple-clic)',text:'Les vitraux de la cathédrale racontent des histoires anciennes et fascinantes.',targetWord:'Les vitraux de la cathédrale racontent des histoires anciennes et fascinantes.',hint:'Indice: Encore une sélection de texte'},
    {type:'select-partial',desc:'Phase 11: 📝 Sélectionne "arrondissement latin" (clic gauche + glisser)',text:'Découvre le cinquième arrondissement latin de Paris avec ses rues charmantes.',targetWord:'arrondissement latin',hint:'Indice: Tourne la statue pour trouver le code'},
    {type:'rotate',desc:'Phase 12: 🗿 Tourne la statue à l\'endroit !\nClique sur les boutons ↻ ou ↺ pour la mettre droite (angle 0°)',items:[{emoji:'🗿',label:'Statue',angle:rnd(1,3)*90}],target:'rotate-0',hint:'Indice: Tourne encore un objet'},
    {type:'rotate',desc:'Phase 13: 🎡 Tourne la roue pour l\'aligner !\nMets la roue à 180°',items:[{emoji:'🎡',label:'Roue',angle:0}],target:'rotate-180',hint:'Indice: Saisis le code secret'},
    {type:'code',desc:'Phase 14: 🔐 Saisis le code secret !\nLe code est: TOUR',items:[{emoji:'🔐',label:'Code'}],target:'code-TOUR',hint:'Indice: Mélange les couleurs'},
    {type:'color',desc:'Phase 15: 🎨 Dernière étape aux Champs-Élysées !\nMélange ROUGE + BLEU pour créer la bonne couleur',items:[{emoji:'🔴',label:'Rouge'},{emoji:'🔵',label:'Bleu'}],target:'color-violet',hint:'🎉 Bravo ! Tu es arrivé(e) aux Champs-Élysées !'}
  ];
  let phase=0,phaseErrors=0,rotAngle=0,colorState=[];
  function init(container){
    $('game-title').textContent='🏆 Révision - Jeu de piste à Paris';
    phase=0;phaseErrors=0;
    renderPhase(container);
  }
  function renderPhase(container){
    container.innerHTML='';
    if(phase>=PHASES.length){finishGame('review',S.gameScore,S.gameErrors);return}
    const p=PHASES[phase];
    if($('game-progress'))$('game-progress').textContent=`Phase: ${phase+1}/${PHASES.length}`;
    // Consigne
    const cons=document.createElement('div');
    cons.className='review-consigne';
    cons.style.whiteSpace='pre-line';
    cons.textContent=p.desc;
    container.appendChild(cons);
    // Game area
    const area=document.createElement('div');
    area.className='review-area';
    area.id='review-area';
    // Place monuments
    MONUMENTS.forEach(m=>{
      const d=document.createElement('div');
      d.className='review-monument';
      d.style.left=m.x+'%';d.style.top=m.y+'%';
      d.textContent=m.emoji;
      d.title=m.name;
      area.appendChild(d);
    });
    // Route line (Gare de Lyon to Champs-Élysées)
    const route=document.createElement('div');
    route.style.cssText='position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,.5);color:#fff;padding:6px 10px;border-radius:8px;font-size:.75em';
    route.innerHTML='🚉 Gare de Lyon → 🗼 Tour Eiffel → 🎨 Louvre → ⛪ Notre-Dame → 🌉 Pont Neuf → 🏛️ Champs-Élysées';
    area.appendChild(route);

    if(p.type==='click'||p.type==='click-right'){
      renderClickPhase(area,p);
    } else if(p.type==='dblclick'){
      renderDblClickPhase(area,p);
    } else if(p.type==='rename'){
      renderRenamePhase(area,p);
    } else if(p.type==='drag'){
      renderDragPhase(area,p);
    } else if(p.type==='select-word'||p.type==='select-sentence'||p.type==='select-partial'){
      renderSelectPhase(area,p);
    } else if(p.type==='rotate'){
      renderRotatePhase(area,p);
    } else if(p.type==='code'){
      renderCodePhase(area,p);
    } else if(p.type==='color'){
      renderColorPhase(area,p);
    }
    container.appendChild(area);
    // Hint from previous phase
    if(phase>0){
      const prevHint=PHASES[phase-1].hint;
      if(prevHint){
        const hint=document.createElement('div');
        hint.style.cssText='background:rgba(255,255,0,.15);color:#ffeaa7;padding:6px 10px;border-radius:8px;font-size:.75em;text-align:center;flex-shrink:0';
        hint.textContent='💡 '+prevHint;
        container.appendChild(hint);
      }
    }
  }
  function randomPos(area){
    return {x:rnd(15,75),y:rnd(15,65)};
  }
  function renderClickPhase(area,p){
    p.items.forEach(item=>{
      const pos=randomPos(area);
      const d=document.createElement('div');
      d.className='review-item';
      d.style.left=pos.x+'%';d.style.top=pos.y+'%';
      d.innerHTML=`<div style="text-align:center"><div style="font-size:2em">${item.emoji}</div><div style="font-size:.6em;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)">${item.label}</div></div>`;
      d.addEventListener('contextmenu',e=>{
        e.preventDefault();e.stopPropagation();
        if(p.target==='click-right'){
          phaseSuccess();return;
        }
        phaseErrors++;addScore(-2);S.gameErrors++;
        d.classList.add('shake');setTimeout(()=>d.classList.remove('shake'),400);
        showError('Non ! Utilise le clic GAUCHE ici');
        checkSkip();
      });
      d.addEventListener('click',e=>{
        if(p.target==='click-left'){
          phaseSuccess();return;
        }
        phaseErrors++;addScore(-2);S.gameErrors++;
        d.classList.add('shake');setTimeout(()=>d.classList.remove('shake'),400);
        showError('Non ! Utilise le clic DROIT ici');
        checkSkip();
      });
      area.appendChild(d);
    });
  }
  function renderDblClickPhase(area,p){
    p.items.forEach(item=>{
      const pos=randomPos(area);
      const d=document.createElement('div');
      d.className='review-item';
      d.style.left=pos.x+'%';d.style.top=pos.y+'%';
      d.innerHTML=`<div style="text-align:center"><div style="font-size:2em">${item.emoji}</div><div style="font-size:.6em;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)">${item.label}</div></div>`;
      d.addEventListener('contextmenu',e=>{
        e.preventDefault();
        phaseErrors++;addScore(-2);S.gameErrors++;
        d.classList.add('shake');setTimeout(()=>d.classList.remove('shake'),400);
        showError('Utilise le DOUBLE-CLIC GAUCHE !');
        checkSkip();
      });
      d.addEventListener('dblclick',e=>{
        e.preventDefault();
        phaseSuccess();
      });
      area.appendChild(d);
    });
  }
  function renderRenamePhase(area,p){
    const item=p.items[0];
    const pos=randomPos(area);
    const d=document.createElement('div');
    d.style.cssText=`position:absolute;left:${pos.x}%;top:${pos.y}%;background:#fff;border-radius:10px;padding:10px 16px;box-shadow:0 4px 15px rgba(0,0,0,.3);cursor:context-menu;z-index:5;display:flex;align-items:center;gap:8px`;
    d.innerHTML=`<span style="font-size:1.5em">${item.emoji}</span><span id="rv-name" style="font-weight:600">${item.label}</span>`;
    d.addEventListener('contextmenu',e=>{
      e.preventDefault();e.stopPropagation();
      showContextMenu(e.clientX,e.clientY,[
        {icon:'✏️',label:'Renommer',action:()=>{
          const nameEl=$('rv-name');
          const input=document.createElement('input');
          input.className='game-input';
          input.style.width='140px';
          input.value=nameEl.textContent;
          nameEl.textContent='';
          nameEl.appendChild(input);
          input.focus();input.select();
          input.addEventListener('keydown',e2=>{
            if(e2.key==='Enter'){
              const val=input.value.trim();
              if(val.toLowerCase()===p.correctName.toLowerCase()){
                phaseSuccess();
              }else{
                phaseErrors++;addScore(-2);S.gameErrors++;
                showError(`Non, le nom correct est: "${p.correctName}"`);
                checkSkip();
              }
            }
          });
        }},
        {icon:'📋',label:'Copier',shortcut:'Ctrl+C',action:()=>{showError('Il faut RENOMMER !')}}
      ]);
    });
    area.appendChild(d);
  }
  function renderDragPhase(area,p){
    const item=p.items[0];
    // Drop zone
    const dz=document.createElement('div');
    dz.id='rv-dropzone';
    dz.style.cssText='position:absolute;right:10px;top:50%;transform:translateY(-50%);width:120px;height:120px;border:3px dashed rgba(255,255,255,.6);border-radius:16px;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;font-size:.85em;font-weight:700;background:rgba(255,255,255,.1);transition:all .3s';
    dz.innerHTML=`<div>📥</div><div>${p.dropZone}</div>`;
    area.appendChild(dz);
    // Draggable item
    const pos=randomPos(area);
    const d=document.createElement('div');
    d.className='review-item';
    d.style.left=pos.x+'%';d.style.top=pos.y+'%';
    d.style.cursor='grab';
    d.innerHTML=`<div style="text-align:center"><div style="font-size:2em">${item.emoji}</div><div style="font-size:.6em;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)">${item.label}</div></div>`;
    let dragging=false,ox=0,oy=0;
    d.addEventListener('mousedown',e=>{
      e.preventDefault();
      dragging=true;
      const r=d.getBoundingClientRect();
      ox=e.clientX-r.left;oy=e.clientY-r.top;
      d.style.zIndex='50';
      d.style.transition='none';
      setMouseAction('Glisser...');
      const onMove=e2=>{
        const ar=area.getBoundingClientRect();
        d.style.left=(e2.clientX-ar.left-ox)+'px';
        d.style.top=(e2.clientY-ar.top-oy)+'px';
        d.style.right='auto';
        d.style.transform='none';
        // Highlight drop zone
        const dzr=dz.getBoundingClientRect();
        if(e2.clientX>=dzr.left&&e2.clientX<=dzr.right&&e2.clientY>=dzr.top&&e2.clientY<=dzr.bottom){
          dz.style.background='rgba(255,255,255,.3)';dz.style.borderColor='#fff';
        }else{
          dz.style.background='rgba(255,255,255,.1)';dz.style.borderColor='rgba(255,255,255,.6)';
        }
      };
      const onUp=e2=>{
        document.removeEventListener('mousemove',onMove);
        document.removeEventListener('mouseup',onUp);
        dragging=false;setMouseAction('Prêt');
        dz.style.background='rgba(255,255,255,.1)';
        // Check drop
        const dzr=dz.getBoundingClientRect();
        if(e2.clientX>=dzr.left&&e2.clientX<=dzr.right&&e2.clientY>=dzr.top&&e2.clientY<=dzr.bottom){
          phaseSuccess();
        }else{
          phaseErrors++;addScore(-2);S.gameErrors++;
          showError('Dépose dans la bonne zone !');
          checkSkip();
        }
      };
      document.addEventListener('mousemove',onMove);
      document.addEventListener('mouseup',onUp);
    });
    area.appendChild(d);
  }
  function norm(s){return s.toLowerCase().replace(/[.,!?;:'"'"]/g,'').replace(/\s+/g,' ').trim()}
  function renderSelectPhase(area,p){
    const overlay=document.createElement('div');
    overlay.style.cssText='position:absolute;inset:10% 5%;background:rgba(255,255,255,.95);border-radius:12px;padding:20px;overflow:auto;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center';
    const instr=document.createElement('div');
    instr.style.cssText='font-size:.85em;color:var(--gray);margin-bottom:12px;text-align:center';
    if(p.type==='select-word')instr.textContent='💡 Double-clic sur le mot';
    else if(p.type==='select-sentence')instr.textContent='💡 Triple-clic pour la phrase';
    else instr.textContent='💡 Clic gauche maintenu + glisser pour sélectionner';
    overlay.appendChild(instr);
    const textEl=document.createElement('div');
    textEl.className='text-passage';
    textEl.style.userSelect='text';
    textEl.style.cursor='text';
    textEl.style.width='100%';
    textEl.textContent=p.text;
    overlay.appendChild(textEl);
    // Button bar
    const btnBar=document.createElement('div');
    btnBar.style.cssText='display:flex;gap:12px;justify-content:center;align-items:center;margin-top:12px;flex-wrap:wrap';
    let checked=false;
    const checkBtn=document.createElement('button');
    checkBtn.className='btn btn-blue';
    checkBtn.style.cssText='min-width:150px';
    checkBtn.textContent='✓ Vérifier';
    checkBtn.addEventListener('mousedown',e=>e.preventDefault());
    checkBtn.addEventListener('click',()=>{
      if(checked)return;
      const sel=window.getSelection().toString().trim();
      if(!sel){phaseErrors++;addScore(-2);S.gameErrors++;showError('Sélectionne du texte !');checkSkip();return}
      // checked moved to success branch
      let ok=false;
      const tw=p.targetWord||'';
      if(p.type==='select-word'){
        ok=norm(sel)===norm(tw);
      }else if(p.type==='select-sentence'){
        ok=norm(sel).length>=norm(tw).length*0.7&&norm(tw).includes(norm(sel).substring(0,10));
      }else{
        const sn=norm(sel),tn=norm(tw);
        ok=sn.includes(tn)||tn.includes(sn);
      }
      if(ok){
        checkBtn.style.cssText='min-width:150px;background:#22c55e;color:#fff;border:none;padding:10px 24px;border-radius:8px;cursor:default';
        checkBtn.textContent='✅ OK !';
        phaseSuccess();
      }else{
        checkBtn.style.cssText='min-width:150px;background:#ef4444;color:#fff;border:none;padding:10px 24px;border-radius:8px;cursor:default;animation:shake .4s';
        checkBtn.textContent='❌ Incorrect';
        phaseErrors++;addScore(-2);S.gameErrors++;
        showError(`Sélection incorrecte. Cherche: "${tw}"`);
        checkSkip();
      }
    });
    btnBar.appendChild(checkBtn);
    overlay.appendChild(btnBar);
    area.appendChild(overlay);
  }
  function renderRotatePhase(area,p){
    const item=p.items[0];
    rotAngle=item.angle||0;
    const center=document.createElement('div');
    center.style.cssText='position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:5';
    const obj=document.createElement('div');
    obj.id='rv-rot-obj';
    obj.style.cssText=`font-size:5em;transform:rotate(${rotAngle}deg);transition:transform .3s;cursor:grab;user-select:none`;
    obj.textContent=item.emoji;
    center.appendChild(obj);
    const angleLabel=document.createElement('div');
    angleLabel.id='rv-angle';
    angleLabel.style.cssText='color:#fff;font-weight:700;margin:8px 0';
    angleLabel.textContent=rotAngle+'°';
    center.appendChild(angleLabel);
    const btns=document.createElement('div');
    btns.style.cssText='display:flex;gap:12px;justify-content:center;margin-top:8px';
    const btnCCW=document.createElement('button');
    btnCCW.className='btn btn-blue';
    btnCCW.textContent='↺ -90°';
    btnCCW.addEventListener('click',()=>{
      rotAngle=(rotAngle-90+360)%360;
      obj.style.transform=`rotate(${rotAngle}deg)`;
      angleLabel.textContent=rotAngle+'°';
      checkRotation(p);
    });
    const btnCW=document.createElement('button');
    btnCW.className='btn btn-purple';
    btnCW.textContent='↻ +90°';
    btnCW.addEventListener('click',()=>{
      rotAngle=(rotAngle+90)%360;
      obj.style.transform=`rotate(${rotAngle}deg)`;
      angleLabel.textContent=rotAngle+'°';
      checkRotation(p);
    });
    btns.appendChild(btnCCW);
    btns.appendChild(btnCW);
    center.appendChild(btns);
    area.appendChild(center);
  }
  function checkRotation(p){
    if(p.target==='rotate-0'&&rotAngle%360===0){phaseSuccess()}
    else if(p.target==='rotate-180'&&rotAngle%360===180){phaseSuccess()}
  }
  function renderCodePhase(area,p){
    const center=document.createElement('div');
    center.style.cssText='position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:5;background:#fff;padding:20px 30px;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.3)';
    center.innerHTML=`<div style="font-size:2em;margin-bottom:10px">🔐</div><div style="font-weight:700;margin-bottom:10px">Code secret:</div>`;
    const input=document.createElement('input');
    input.className='game-input';
    input.style.cssText='text-align:center;font-size:1.3em;letter-spacing:3px;text-transform:uppercase';
    input.placeholder='Tape le code...';
    input.maxLength=10;
    input.addEventListener('keydown',e=>{
      if(e.key==='Enter'){
        if(input.value.trim().toUpperCase()==='TOUR'){
          phaseSuccess();
        }else{
          phaseErrors++;addScore(-2);S.gameErrors++;
          showError('Le code est: TOUR');
          checkSkip();
        }
      }
    });
    center.appendChild(input);
    const hint=document.createElement('div');
    hint.style.cssText='margin-top:8px;color:var(--gray);font-size:.8em';
    hint.textContent='Indice: C\'est un monument de Paris... 🗼';
    center.appendChild(hint);
    area.appendChild(center);
    setTimeout(()=>input.focus(),100);
  }
  function renderColorPhase(area,p){
    colorState=[];
    const center=document.createElement('div');
    center.style.cssText='position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:5';
    center.innerHTML='<div style="color:#fff;font-weight:700;margin-bottom:15px;font-size:1.1em">Clique sur les couleurs dans l\'ordre</div>';
    const colors=document.createElement('div');
    colors.style.cssText='display:flex;gap:20px;justify-content:center;margin-bottom:15px';
    [{emoji:'🔴',name:'Rouge',hex:'#e74c3c'},{emoji:'🔵',name:'Bleu',hex:'#3498db'}].forEach(c=>{
      const d=document.createElement('div');
      d.className='color-drop';
      d.style.background=c.hex;
      d.textContent=c.emoji;
      d.addEventListener('click',()=>{
        if(!colorState.includes(c.name)){
          colorState.push(c.name);
          d.style.border='3px solid #fff';
          d.style.transform='scale(.9)';
          if(colorState.length===2){
            // Check result
            setTimeout(()=>{
              const result=document.createElement('div');
              result.style.cssText='width:80px;height:80px;border-radius:50%;background:#8e44ad;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:1.5em;animation:pop .5s';
              result.textContent='🟣';
              result.style.color='#fff';
              center.appendChild(result);
              setTimeout(()=>phaseSuccess(),600);
            },300);
          }
        }
      });
      colors.appendChild(d);
    });
    center.appendChild(colors);
    const resultArea=document.createElement('div');
    resultArea.id='rv-color-result';
    resultArea.style.cssText='min-height:90px';
    center.appendChild(resultArea);
    area.appendChild(center);
  }
  function phaseSuccess(){
    addScore(6);
    phaseErrors=0;
    showSuccess(`Phase ${phase+1} réussie !`);
    phase++;
    setTimeout(()=>renderPhase($('game-content')),800);
  }
  function skip(){
    phaseErrors=0;
    phase++;
    renderPhase($('game-content'));
  }
  function checkSkip(){
    if(phaseErrors>=3&&!document.getElementById('rv-skip-btn')){
      const nb=document.createElement('div');
      nb.id='rv-skip-btn';
      nb.style.cssText='text-align:center;padding:4px;flex-shrink:0';
      nb.innerHTML='<button class="btn btn-purple" onclick="Games.review._skip()">⏭️ Passer cette phase (3 erreurs)</button>';
      $('game-content').appendChild(nb);
    }
  }
  return {init,_skip:skip};
})();

/* ===== INIT ===== */
showMenu();
</script>
</body>
</html>
